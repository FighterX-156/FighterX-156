<svg width="800" height="290" viewBox="0 0 800 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current mission: Full-Stack Development 85%, Data Structures and Algorithms 72%, Problem Solving 65%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#39FF88"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    .label { font-size: 13px; fill: #c9d1d9; letter-spacing: 1.5px; font-weight: 700; }
    .pct { font-size: 14px; fill: #39FF88; font-weight: 700; text-anchor: end; }
    .meta { font-size: 11px; fill: #39FF88; letter-spacing: 2px; }
    .muted { font-size: 12px; fill: #8b949e; }
    .track { fill: #161b22; }
    .fill { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; }
    .d2 { animation-delay: .15s; }
    .d3 { animation-delay: .3s; }
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <!-- card -->
  <rect x="0.5" y="0.5" width="799" height="289" rx="12" fill="#0d1117" stroke="#21262d"/>

  <!-- header -->
  <circle class="dot" cx="32" cy="33" r="4" fill="#39FF88"/>
  <text x="46" y="37" class="meta">LIVE STATUS</text>
  <text x="768" y="37" class="meta" text-anchor="end" fill="#8b949e" style="fill:#8b949e">IN PROGRESS</text>
  <line x1="32" y1="56" x2="768" y2="56" stroke="#21262d"/>

  <!-- row 1 -->
  <text x="32" y="90" class="label">FULL-STACK DEVELOPMENT</text>
  <text x="768" y="90" class="pct">85%</text>
  <rect x="32" y="102" width="736" height="8" rx="4" class="track"/>
  <rect x="32" y="102" width="625.6" height="8" rx="4" fill="url(#g)" class="fill"/>

  <!-- row 2 -->
  <text x="32" y="150" class="label">DATA STRUCTURES &amp; ALGORITHMS</text>
  <text x="768" y="150" class="pct">72%</text>
  <rect x="32" y="162" width="736" height="8" rx="4" class="track"/>
  <rect x="32" y="162" width="529.92" height="8" rx="4" fill="url(#g)" class="fill d2"/>

  <!-- row 3 -->
  <text x="32" y="210" class="label">PROBLEM SOLVING</text>
  <text x="768" y="210" class="pct">65%</text>
  <rect x="32" y="222" width="736" height="8" rx="4" class="track"/>
  <rect x="32" y="222" width="478.4" height="8" rx="4" fill="url(#g)" class="fill d3"/>

  <!-- footer -->
  <line x1="32" y1="248" x2="768" y2="248" stroke="#21262d"/>
  <text x="32" y="271" class="muted"><tspan fill="#39FF88" font-weight="700">&gt; Core Focus:</tspan> Strengthening fundamentals, writing maintainable code, and building projects that solve real problems.</text>
</svg>
